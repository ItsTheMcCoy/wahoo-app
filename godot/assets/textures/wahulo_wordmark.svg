<svg xmlns="http://www.w3.org/2000/svg" width="1635" height="510" viewBox="155 90 1090 340">
  <defs>
    <radialGradient id="marbleRed" cx="35%" cy="28%" r="72%">
      <stop offset="0%" stop-color="#f3ede7" stop-opacity=".62"/>
      <stop offset="18%" stop-color="#971f1a" stop-opacity="1"/>
      <stop offset="72%" stop-color="#971f1a" stop-opacity="1"/>
      <stop offset="100%" stop-color="#4b0d0a"/>
    </radialGradient>
    <radialGradient id="marbleGreen" cx="35%" cy="28%" r="72%">
      <stop offset="0%" stop-color="#eff3ec" stop-opacity=".60"/>
      <stop offset="18%" stop-color="#1a5928" stop-opacity="1"/>
      <stop offset="72%" stop-color="#1a5928" stop-opacity="1"/>
      <stop offset="100%" stop-color="#0c2b14"/>
    </radialGradient>
    <radialGradient id="marbleYellow" cx="35%" cy="28%" r="72%">
      <stop offset="0%" stop-color="#f8f1dc" stop-opacity=".66"/>
      <stop offset="18%" stop-color="#a87f1d" stop-opacity="1"/>
      <stop offset="74%" stop-color="#a87f1d" stop-opacity="1"/>
      <stop offset="100%" stop-color="#59420b"/>
