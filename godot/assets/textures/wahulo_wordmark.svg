  <rect width="100%" height="100%" fill="none"/>

  <g filter="url(#tinyShadow)">
    <g transform="rotate(-2 230 270)">

      <circle cx="230" cy="222" r="30" fill="url(#marbleRed)" stroke="#1a1712" stroke-width="3.2"/>
      <ellipse cx="221.6" cy="212.4" rx="7.2" ry="5.1" fill="#ffffff" opacity=".55"/>
      <path d="M 216.5 190.6 C 227.0 218.4, 237.5 221.4, 244.4 227.4" fill="none" stroke="#ffffff" stroke-width="2.1" stroke-linecap="round" opacity=".22"/>


      <circle cx="230" cy="318" r="30" fill="url(#marbleGreen)" stroke="#1a1712" stroke-width="3.2"/>
      <ellipse cx="221.6" cy="308.4" rx="7.2" ry="5.1" fill="#ffffff" opacity=".55"/>
      <path d="M 216.5 286.6 C 227.0 314.4, 237.5 317.4, 244.4 323.4" fill="none" stroke="#ffffff" stroke-width="2.1" stroke-linecap="round" opacity=".22"/>

    </g>

    <g transform="rotate(-2 1170 238)">

      <circle cx="1170" cy="190" r="30" fill="url(#marbleYellow)" stroke="#1a1712" stroke-width="3.2"/>
      <ellipse cx="1161.6" cy="180.4" rx="7.2" ry="5.1" fill="#ffffff" opacity=".55"/>
      <path d="M 1156.5 190.6 C 1167.0 186.4, 1177.5 189.4, 1184.4 195.4" fill="none" stroke="#ffffff" stroke-width="2.1" stroke-linecap="round" opacity=".22"/>


      <circle cx="1170" cy="286" r="30" fill="url(#marbleBlue)" stroke="#1a1712" stroke-width="3.2"/>
      <ellipse cx="1161.6" cy="276.4" rx="7.2" ry="5.1" fill="#ffffff" opacity=".55"/>
      <path d="M 1156.5 286.6 C 1167.0 282.4, 1177.5 285.4, 1184.4 291.4" fill="none" stroke="#ffffff" stroke-width="2.1" stroke-linecap="round" opacity=".22"/>

    </g>
  </g>

  <g filter="url(#softShadow)" transform="rotate(-2 700 260)">
    <text x="700" y="328" text-anchor="middle"
          font-family="'Nunito','Arial Rounded MT Bold','Aptos Rounded','Verdana',sans-serif"
          font-size="196" font-weight="1000" letter-spacing="-6px"
          fill="none" stroke="#4a3220" stroke-width="13"
          stroke-linejoin="round" stroke-linecap="round">Wahulo</text>
    <text x="700" y="328" text-anchor="middle"
          font-family="'Nunito','Arial Rounded MT Bold','Aptos Rounded','Verdana',sans-serif"
          font-size="196" font-weight="1000" letter-spacing="-6px"
          fill="url(#ivoryBody)">Wahulo</text>
    <path d="M430 365 C540 395, 850 398, 975 362" fill="none" stroke="#ffffff" stroke-opacity=".22" stroke-width="12" stroke-linecap="round"/>
