<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, user-scalable=no, initial-scale=1.0">
	<meta name="theme-color" content="#1e160e">
	<meta property="og:title" content="Wahulo: Marble Mayham">
	<meta property="og:description" content="A marble race for 4 players">
	<meta property="og:image" content="https://wahulo.com/og_preview.png">
	<meta property="og:type" content="website">
	<meta property="og:url" content="https://wahulo.com">
	<meta name="twitter:card" content="summary_large_image">
	<title>Wahulo: Marble Mayham</title>
	<style>
html, body {
	margin: 0;
	padding: 0;
	border: 0;
	background-color: #070503;
	background-image: url('background_felt_tile_512.svg');
	background-repeat: repeat;
	background-size: 512px 512px;
	overflow: hidden;
	touch-action: none;
}

#canvas {
	display: block;
}

#canvas:focus {
	outline: none;
}

#loading-screen {
	position: fixed;
	inset: 0;
	background: transparent;
	display: flex;
	flex-direction: column;
	align-items: center;
	justify-content: center;
	font-family: Georgia, 'Times New Roman', serif;
	z-index: 100;
}

#wordmark {
	width: min(1040px, 95vw);
	height: auto;
	margin-bottom: 8px;
}

.game-subtitle {
	font-size: clamp(0.8rem, 2.5vw, 1.1rem);
	letter-spacing: 0.35em;
	text-transform: none;
	color: #fff0c4;
	font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
	margin-bottom: 44px;
}

.progress-track {
	width: min(300px, 55vw);
	height: 5px;
	background: rgba(255, 255, 255, 0.08);
	border-radius: 3px;
	overflow: hidden;
	margin-bottom: 14px;
}

#progress-fill {
	height: 100%;
	width: 0%;
	background: linear-gradient(90deg, #8a5a18, #c8922a, #e8b84a);
	border-radius: 3px;
	transition: width 0.25s ease;
}

#loading-label {
	font-size: 0.7rem;
	letter-spacing: 0.25em;
	text-transform: uppercase;
	color: #4a3020;
	font-family: sans-serif;
}

#error-overlay {
	display: none;
	position: fixed;
	inset: 0;
	align-items: center;
	justify-content: center;
	background: rgba(0, 0, 0, 0.88);
	z-index: 200;
}

#error-overlay.visible {
	display: flex;
}

#error-box {
	background: #3a1a1a;
	border: 1px solid #8a3030;
	border-radius: 8px;
	color: #e0d0d0;
	font-family: sans-serif;
	font-size: 0.9rem;
	line-height: 1.4;
	max-width: 500px;
	padding: 1.5rem 2rem;
	text-align: center;
	white-space: pre-wrap;
}
	</style>
	<link id="-gd-engine-icon" rel="icon" type="image/png" href="index.icon.png" />
<link rel="apple-touch-icon" href="index.apple-touch-icon.png"/>

</head>
<body>
	<canvas id="canvas">
		Your browser does not support the canvas tag.
	</canvas>

	<noscript>
		Your browser does not support JavaScript.
	</noscript>

	<div id="loading-screen">
		<img id="wordmark" src="wahulo_wordmark.svg" alt="Wahulo">
		<div class="game-subtitle">Marble Mayhem</div>
		<div class="progress-track">
			<div id="progress-fill"></div>
		</div>
		<div id="loading-label">Loading&hellip;</div>
	</div>

	<div id="error-overlay">
		<div id="error-box"></div>
	</div>

	<script src="index.js"></script>
	<script>
const GODOT_CONFIG = {"args":[],"canvasResizePolicy":2,"emscriptenPoolSize":8,"ensureCrossOriginIsolationHeaders":true,"executable":"index","experimentalVK":false,"fileSizes":{"index.pck":2385032,"index.wasm":37700666},"focusCanvas":true,"gdextensionLibs":[],"godotPoolSize":4};
const GODOT_THREADS_ENABLED = false;
const engine = new Engine(GODOT_CONFIG);

(function () {
	const loadingScreen = document.getElementById('loading-screen');
	const progressFill = document.getElementById('progress-fill');
	const errorOverlay = document.getElementById('error-overlay');
	const errorBox = document.getElementById('error-box');

	function showError(err) {
		console.error(err);
		const msg = (err instanceof Error) ? err.message
		          : (typeof err === 'string') ? err
		          : 'An unknown error occurred.';
		errorBox.textContent = msg;
		errorOverlay.classList.add('visible');
	}

	const missing = Engine.getMissingFeatures({
		threads: GODOT_THREADS_ENABLED,
	});

	if (missing.length !== 0) {
		if (GODOT_CONFIG['serviceWorker'] && GODOT_CONFIG['ensureCrossOriginIsolationHeaders'] && 'serviceWorker' in navigator) {
			let serviceWorkerRegistrationPromise;
			try {
				serviceWorkerRegistrationPromise = navigator.serviceWorker.getRegistration();
			} catch (err) {
				serviceWorkerRegistrationPromise = Promise.reject(new Error('Service worker registration failed.'));
			}
			Promise.race([
				serviceWorkerRegistrationPromise.then((registration) => {
					if (registration != null) {
						return Promise.reject(new Error('Service worker already exists.'));
					}
					return registration;
				}).then(() => engine.installServiceWorker()),
				new Promise((resolve) => {
					setTimeout(() => resolve(), 2000);
				}),
			]).then(() => {
				window.location.reload();
			}).catch((err) => {
				console.error('Error while registering service worker:', err);
			});
		} else {
			const missingMsg = 'Error\nThe following features required to run Godot projects on the Web are missing:\n';
			showError(missingMsg + missing.join('\n'));
		}
	} else {
		engine.startGame({
			'onProgress': function (current, total) {
				if (current > 0 && total > 0) {
					progressFill.style.width = Math.round(current / total * 100) + '%';
				}
			},
		}).then(() => {
			loadingScreen.remove();
		}, showError);
	}
}());
	</script>
</body>
</html>
