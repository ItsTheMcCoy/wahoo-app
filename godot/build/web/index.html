<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
	<base href="/">
	<meta name="theme-color" content="#1e160e">
	<meta property="og:title" content="Wahulo: Marble Mayham">
	<meta property="og:description" content="A marble race for 4 players">
	<meta property="og:image" content="https://wahulo.com/og_preview.png">
	<meta property="og:type" content="website">
	<meta property="og:url" content="https://wahulo.com">
	<meta name="twitter:card" content="summary_large_image">
	<title>Wahulo: Marble Mayham</title>
	<style>
:root {
	--app-height: 100vh;
}

html, body {
	margin: 0;
	padding: 0;
	border: 0;
	width: 100%;
	height: var(--app-height);
	background-color: #070503;
	background-image: url('background_felt_tile_512.svg');
	background-repeat: repeat;
	background-size: 512px 512px;
	overflow: hidden;
	overscroll-behavior: none;
}

#canvas {
	display: block;
	width: 100%;
	height: 100%;
	touch-action: none;
}

#canvas:focus {
	outline: none;
}

#loading-screen {
	position: fixed;
	inset: 0;
	background: transparent;
	display: flex;
	flex-direction: column;
	align-items: center;
	justify-content: center;
	font-family: Georgia, 'Times New Roman', serif;
	z-index: 100;
}

#wordmark {
	width: min(1560px, 95vw);
	height: auto;
	margin-bottom: 8px;
}

.game-subtitle {
	font-size: clamp(0.8rem, 2.5vw, 1.1rem);
	letter-spacing: 0.35em;
	text-transform: none;
	color: #fff0c4;
	font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
	margin-bottom: 44px;
}

.progress-track {
	width: min(300px, 55vw);
	height: 5px;
	background: rgba(255, 255, 255, 0.08);
	border-radius: 3px;
	overflow: hidden;
	margin-bottom: 14px;
}

#progress-fill {
	height: 100%;
	width: 0%;
	background: linear-gradient(90deg, #8a5a18, #c8922a, #e8b84a);
	border-radius: 3px;
	transition: width 0.25s ease;
}

#loading-label {
	font-size: 0.7rem;
	letter-spacing: 0.25em;
	text-transform: uppercase;
	color: #4a3020;
	font-family: sans-serif;
}

#error-overlay {
	display: none;
	position: fixed;
	inset: 0;
	align-items: center;
	justify-content: center;
	background: rgba(0, 0, 0, 0.88);
	z-index: 200;
}

#error-overlay.visible {
	display: flex;
}

#error-box {
	background: #3a1a1a;
	border: 1px solid #8a3030;
	border-radius: 8px;
	color: #e0d0d0;
	font-family: sans-serif;
	font-size: 0.9rem;
	line-height: 1.4;
	max-width: 500px;
	padding: 1.5rem 2rem;
	text-align: center;
	white-space: pre-wrap;
}

#fullscreen-btn {
	position: fixed;
	left: max(12px, env(safe-area-inset-left));
	bottom: max(12px, env(safe-area-inset-bottom));
	display: none;
	align-items: center;
	justify-content: center;
	padding: 12px 14px;
	border: 1px solid rgba(235, 186, 92, 0.72);
	border-radius: 10px;
	background: rgba(21, 14, 9, 0.88);
	color: #f3ddad;
	font: 600 13px/1.1 'Segoe UI', Tahoma, sans-serif;
	letter-spacing: 0.04em;
	cursor: pointer;
	backdrop-filter: blur(2px);
	z-index: 180;
}

#fullscreen-btn:active {
	transform: translateY(1px);
}

@media (pointer: coarse) {
	#fullscreen-btn {
		display: inline-flex;
	}
}
	</style>
	<link id="-gd-engine-icon" rel="icon" type="image/png" href="index.icon.png" />
<link rel="apple-touch-icon" href="index.apple-touch-icon.png"/>

</head>
<body>
	<canvas id="canvas">
		Your browser does not support the canvas tag.
	</canvas>

	<noscript>
		Your browser does not support JavaScript.
	</noscript>

	<div id="loading-screen">
		<img id="wordmark" src="wahulo_wordmark.svg" alt="Wahulo">
		<div class="game-subtitle">Marble Mayhem</div>
		<div class="progress-track">
			<div id="progress-fill"></div>
		</div>
		<div id="loading-label">Loading&hellip;</div>
	</div>

	<div id="error-overlay">
		<div id="error-box"></div>
	</div>

	<button id="fullscreen-btn" type="button" aria-label="Enter fullscreen">Fullscreen</button>

	<script src="index.js"></script>
	<script>
const GODOT_CONFIG = {"args":[],"canvasResizePolicy":2,"emscriptenPoolSize":8,"ensureCrossOriginIsolationHeaders":true,"executable":"index","experimentalVK":false,"fileSizes":{"index.pck":2255964,"index.wasm":37700666},"focusCanvas":true,"gdextensionLibs":[],"godotPoolSize":4};
GODOT_CONFIG.executable = "/index";
GODOT_CONFIG.mainPack = "/index.pck?v=" + String(Date.now());
const GODOT_THREADS_ENABLED = false;
const engine = new Engine(GODOT_CONFIG);

(function () {
	const loadingScreen = document.getElementById('loading-screen');
	const progressFill = document.getElementById('progress-fill');
	const errorOverlay = document.getElementById('error-overlay');
	const errorBox = document.getElementById('error-box');
	const fullscreenBtn = document.getElementById('fullscreen-btn');

	function updateCanvasHeight() {
		const vh = window.innerHeight;
		document.documentElement.style.setProperty('--app-height', `${vh}px`);
	}

	function isFullscreen() {
		return !!(
			document.fullscreenElement ||
			document.webkitFullscreenElement ||
			document.msFullscreenElement
		);
	}

	function supportsFullscreen(element) {
		return !!(
			element &&
			(element.requestFullscreen || element.webkitRequestFullscreen || element.msRequestFullscreen)
		);
	}

	async function requestFullscreenForGame() {
		const gameCanvas = document.getElementById('canvas');
		const target = supportsFullscreen(gameCanvas) ? gameCanvas : document.documentElement;
		const request = target.requestFullscreen || target.webkitRequestFullscreen || target.msRequestFullscreen;
		if (request) {
			await request.call(target);
		}
	}

	function updateFullscreenButton() {
		if (!fullscreenBtn) {
			return;
		}
		const isTouchDevice = window.matchMedia('(pointer: coarse)').matches;
		fullscreenBtn.style.display = (isTouchDevice && !isFullscreen()) ? 'inline-flex' : 'none';
	}

	if (fullscreenBtn) {
		fullscreenBtn.addEventListener('click', async () => {
			try {
				if (isFullscreen()) {
					await document.exitFullscreen();
				} else {
					await requestFullscreenForGame();
				}
			} catch (_err) {
				/* Ignore unsupported fullscreen requests. */
			}
			updateFullscreenButton();
		});
	}

	window.addEventListener('resize', updateCanvasHeight);
	document.addEventListener('fullscreenchange', updateFullscreenButton);
	updateCanvasHeight();
	updateFullscreenButton();

	function showError(err) {
		console.error(err);
		const msg = (err instanceof Error) ? err.message
		          : (typeof err === 'string') ? err
		          : 'An unknown error occurred.';
		errorBox.textContent = msg;
		errorOverlay.classList.add('visible');
	}

	const missing = Engine.getMissingFeatures({
		threads: GODOT_THREADS_ENABLED,
	});

	if (missing.length !== 0) {
		if (GODOT_CONFIG['serviceWorker'] && GODOT_CONFIG['ensureCrossOriginIsolationHeaders'] && 'serviceWorker' in navigator) {
			let serviceWorkerRegistrationPromise;
			try {
				serviceWorkerRegistrationPromise = navigator.serviceWorker.getRegistration();
			} catch (err) {
				serviceWorkerRegistrationPromise = Promise.reject(new Error('Service worker registration failed.'));
			}
			Promise.race([
				serviceWorkerRegistrationPromise.then((registration) => {
					if (registration != null) {
						return Promise.reject(new Error('Service worker already exists.'));
					}
					return registration;
				}).then(() => engine.installServiceWorker()),
				new Promise((resolve) => {
					setTimeout(() => resolve(), 2000);
				}),
			]).then(() => {
				window.location.reload();
			}).catch((err) => {
				console.error('Error while registering service worker:', err);
			});
		} else {
			const missingMsg = 'Error\nThe following features required to run Godot projects on the Web are missing:\n';
			showError(missingMsg + missing.join('\n'));
		}
	} else {
		engine.startGame({
			'onProgress': function (current, total) {
				if (current > 0 && total > 0) {
					progressFill.style.width = Math.round(current / total * 100) + '%';
				}
			},
		}).then(() => {
			loadingScreen.remove();
		}, showError);
	}
}());
	</script>
</body>
</html>
