<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, user-scalable=no, initial-scale=1.0">
	<meta name="theme-color" content="#1e160e">
	<title>Wahulo: Marble Mayham</title>
	<style>
html, body {
	margin: 0;
	padding: 0;
	border: 0;
	background: #1e160e;
	overflow: hidden;
	touch-action: none;
}

#canvas {
	display: block;
}

#canvas:focus {
	outline: none;
}

#loading-screen {
	position: fixed;
	inset: 0;
	background: #1e160e;
	display: flex;
	flex-direction: column;
	align-items: center;
	justify-content: center;
	font-family: Georgia, 'Times New Roman', serif;
	z-index: 100;
}

.marbles {
	display: flex;
	gap: 14px;
	margin-bottom: 32px;
}

.marble {
	width: 22px;
	height: 22px;
	border-radius: 50%;
	animation: marble-pulse 1.4s ease-in-out infinite;
}

.marble-red {
	background: radial-gradient(circle at 36% 36%, #f05040, #a82218);
	box-shadow: 0 2px 8px rgba(168, 34, 24, 0.5);
	animation-delay: 0s;
}

.marble-green {
	background: radial-gradient(circle at 36% 36%, #40c060, #1a7a38);
	box-shadow: 0 2px 8px rgba(26, 122, 56, 0.5);
	animation-delay: 0.2s;
}

.marble-yellow {
	background: radial-gradient(circle at 36% 36%, #f8d458, #b08010);
	box-shadow: 0 2px 8px rgba(176, 128, 16, 0.5);
	animation-delay: 0.4s;
}

.marble-blue {
	background: radial-gradient(circle at 36% 36%, #4878e8, #1a3090);
	box-shadow: 0 2px 8px rgba(26, 48, 144, 0.5);
	animation-delay: 0.6s;
}

@keyframes marble-pulse {
	0%, 100% { transform: translateY(0) scale(1); opacity: 0.75; }
	50% { transform: translateY(-5px) scale(1.1); opacity: 1; }
}

.game-title {
	font-size: clamp(2.8rem, 10vw, 5.5rem);
	font-weight: bold;
	letter-spacing: 0.12em;
	color: #c8922a;
	text-shadow: 0 2px 16px rgba(0, 0, 0, 0.7), 0 0 60px rgba(200, 146, 42, 0.15);
	margin-bottom: 6px;
	line-height: 1;
}

.game-subtitle {
	font-size: clamp(0.8rem, 2.5vw, 1.1rem);
	letter-spacing: 0.35em;
	text-transform: uppercase;
	color: #75573d;
	margin-bottom: 52px;
}

.progress-track {
	width: min(300px, 55vw);
	height: 5px;
	background: rgba(255, 255, 255, 0.08);
	border-radius: 3px;
	overflow: hidden;
	margin-bottom: 14px;
}

#progress-fill {
	height: 100%;
	width: 0%;
	background: linear-gradient(90deg, #8a5a18, #c8922a, #e8b84a);
	border-radius: 3px;
	transition: width 0.25s ease;
}

#loading-label {
	font-size: 0.7rem;
	letter-spacing: 0.25em;
	text-transform: uppercase;
	color: #4a3020;
	font-family: sans-serif;
}

#error-overlay {
	display: none;
	position: fixed;
	inset: 0;
	align-items: center;
	justify-content: center;
	background: rgba(0, 0, 0, 0.88);
	z-index: 200;
}

#error-overlay.visible {
	display: flex;
}

#error-box {
	background: #3a1a1a;
	border: 1px solid #8a3030;
	border-radius: 8px;
	color: #e0d0d0;
	font-family: sans-serif;
	font-size: 0.9rem;
	line-height: 1.4;
	max-width: 500px;
	padding: 1.5rem 2rem;
	text-align: center;
	white-space: pre-wrap;
}
	</style>
	$GODOT_HEAD_INCLUDE
</head>
<body>
	<canvas id="canvas">
		Your browser does not support the canvas tag.
	</canvas>

	<noscript>
		Your browser does not support JavaScript.
	</noscript>

	<div id="loading-screen">
		<div class="marbles">
			<div class="marble marble-red"></div>
			<div class="marble marble-green"></div>
			<div class="marble marble-yellow"></div>
			<div class="marble marble-blue"></div>
		</div>
		<div class="game-title">Wahulo</div>
		<div class="game-subtitle">Marble Mayham</div>
		<div class="progress-track">
			<div id="progress-fill"></div>
		</div>
		<div id="loading-label">Loading&hellip;</div>
	</div>

	<div id="error-overlay">
		<div id="error-box"></div>
	</div>

	<script src="index.js"></script>
	<script>
const GODOT_CONFIG = $GODOT_CONFIG;
const GODOT_THREADS_ENABLED = $GODOT_THREADS_ENABLED;
const engine = new Engine(GODOT_CONFIG);

(function () {
	const loadingScreen = document.getElementById('loading-screen');
	const progressFill = document.getElementById('progress-fill');
	const errorOverlay = document.getElementById('error-overlay');
	const errorBox = document.getElementById('error-box');

	function showError(err) {
		console.error(err);
		const msg = (err instanceof Error) ? err.message
		          : (typeof err === 'string') ? err
		          : 'An unknown error occurred.';
		errorBox.textContent = msg;
		errorOverlay.classList.add('visible');
	}

	const missing = Engine.getMissingFeatures({
		threads: GODOT_THREADS_ENABLED,
	});

	if (missing.length !== 0) {
		if (GODOT_CONFIG['serviceWorker'] && GODOT_CONFIG['ensureCrossOriginIsolationHeaders'] && 'serviceWorker' in navigator) {
			let serviceWorkerRegistrationPromise;
			try {
				serviceWorkerRegistrationPromise = navigator.serviceWorker.getRegistration();
			} catch (err) {
				serviceWorkerRegistrationPromise = Promise.reject(new Error('Service worker registration failed.'));
			}
			Promise.race([
				serviceWorkerRegistrationPromise.then((registration) => {
					if (registration != null) {
						return Promise.reject(new Error('Service worker already exists.'));
					}
					return registration;
				}).then(() => engine.installServiceWorker()),
				new Promise((resolve) => {
					setTimeout(() => resolve(), 2000);
				}),
			]).then(() => {
				window.location.reload();
			}).catch((err) => {
				console.error('Error while registering service worker:', err);
			});
		} else {
			const missingMsg = 'Error\nThe following features required to run Godot projects on the Web are missing:\n';
			showError(missingMsg + missing.join('\n'));
		}
	} else {
		engine.startGame({
			'onProgress': function (current, total) {
				if (current > 0 && total > 0) {
					progressFill.style.width = Math.round(current / total * 100) + '%';
				}
			},
		}).then(() => {
			loadingScreen.remove();
		}, showError);
	}
}());
	</script>
</body>
</html>
